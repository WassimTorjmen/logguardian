apiVersion: v1
kind: ConfigMap
metadata:
  name: email-sender-config
  namespace: logguardian
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka.logguardian.svc.cluster.local:29092
  KAFKA_TOPIC: logs-anomalies-ml
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
  ALERT_BATCH_SECONDS: "900"
  ALERT_BATCH_MAX_SIZE: "300"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-sender
  namespace: logguardian
spec:
  # Volontairement à 0 par défaut : tant que le seuil ML de démo (0.3) est actif,
  # le volume d'anomalies remplit un lot de 300 en quelques minutes — laisser
  # tourner en continu viderait le quota SendGrid (100/jour) très vite.
  # Activer manuellement via `kubectl scale --replicas=1` au moment voulu,
  # puis repasser à 0 juste après confirmation d'envoi (voir demo-scenario/COMMANDES.md).
  replicas: 0
  selector:
    matchLabels:
      app: email-sender
  template:
    metadata:
      labels:
        app: email-sender
    spec:
      enableServiceLinks: false
      containers:
        - name: email-sender
          image: europe-west1-docker.pkg.dev/logguardian-497218/logguardian/email-sender:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: email-sender-config
            - secretRef:
                name: monitoring-ui-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
