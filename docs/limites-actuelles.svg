<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>

  <text x="600" y="60" text-anchor="middle" font-size="14" fill="#6b7280" letter-spacing="2">PROJET LOGGUARDIAN</text>
  <text x="600" y="100" text-anchor="middle" font-size="32" font-weight="500" fill="#111827">Limites actuelles</text>
  <line x1="530" y1="120" x2="670" y2="120" stroke="#A32D2D" stroke-width="2"/>

  <g transform="translate(100,170)">
    <rect width="1000" height="500" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="0" y="0" width="1000" height="56" rx="14" fill="#FCEBEB"/>
    <rect x="0" y="42" width="1000" height="14" fill="#FCEBEB"/>
    <circle cx="36" cy="28" r="16" fill="#A32D2D"/>
    <text x="36" y="34" text-anchor="middle" font-size="18" font-weight="500" fill="#ffffff">!</text>
    <text x="66" y="34" font-size="20" font-weight="500" fill="#501313">Points à améliorer dans la plateforme</text>

    <g transform="translate(50,110)">

      <g transform="translate(0,0)">
        <circle cx="10" cy="14" r="6" fill="#A32D2D"/>
        <text x="30" y="18" font-size="17" font-weight="500" fill="#111827">Seuil de détection fixe</text>
        <text x="30" y="42" font-size="14" fill="#374151">Pas d'adaptation dynamique au volume de logs ou au type de source —</text>
        <text x="30" y="62" font-size="14" fill="#374151">le même seuil s'applique à toutes les machines et heures de la journée.</text>
      </g>

      <g transform="translate(0,130)">
        <circle cx="10" cy="14" r="6" fill="#A32D2D"/>
        <text x="30" y="18" font-size="17" font-weight="500" fill="#111827">Kafka sans persistance</text>
        <text x="30" y="42" font-size="14" fill="#374151">Données et offsets des consumers perdus à chaque redémarrage —</text>
        <text x="30" y="62" font-size="14" fill="#374151">les services reprennent en "latest" et perdent l'historique récent.</text>
      </g>

      <g transform="translate(0,260)">
        <circle cx="10" cy="14" r="6" fill="#A32D2D"/>
        <text x="30" y="18" font-size="17" font-weight="500" fill="#111827">Sécurité et accès limités</text>
        <text x="30" y="42" font-size="14" fill="#374151">Un seul compte utilisateur (pas de RBAC), pas de HTTPS natif sur le</text>
        <text x="30" y="62" font-size="14" fill="#374151">LoadBalancer, quota SendGrid trial limité à 100 emails par jour.</text>
      </g>

    </g>
  </g>

  <text x="600" y="700" text-anchor="middle" font-size="12" fill="#9ca3af">LogGuardian — AIOps Command Center</text>
</svg>
