<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="720" fill="#ffffff"/>

  <text x="600" y="60" text-anchor="middle" font-size="14" fill="#6b7280" letter-spacing="2">PROJET LOGGUARDIAN</text>
  <text x="600" y="100" text-anchor="middle" font-size="32" font-weight="500" fill="#111827">Limites actuelles et améliorations possibles</text>
  <line x1="430" y1="120" x2="770" y2="120" stroke="#e5e7eb" stroke-width="1"/>

  <g transform="translate(50,160)">
    <rect width="540" height="510" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="0" y="0" width="540" height="56" rx="14" fill="#FCEBEB"/>
    <rect x="0" y="42" width="540" height="14" fill="#FCEBEB"/>
    <circle cx="30" cy="28" r="14" fill="#A32D2D"/>
    <text x="30" y="33" text-anchor="middle" font-size="16" font-weight="500" fill="#ffffff">!</text>
    <text x="60" y="34" font-size="20" font-weight="500" fill="#501313">Limites actuelles</text>

    <g transform="translate(30,95)" fill="#374151" font-size="14">
      <circle cx="6" cy="-4" r="3" fill="#A32D2D"/>
      <text x="22" y="0" font-weight="500" fill="#111827">Seuil de détection fixe</text>
      <text x="22" y="20">Pas d'adaptation dynamique au volume</text>
      <text x="22" y="38">ou au type de source.</text>

      <circle cx="6" cy="66" r="3" fill="#A32D2D"/>
      <text x="22" y="70" font-weight="500" fill="#111827">Source Android non exploitée</text>
      <text x="22" y="90">Parser présent mais pas intégrée aux</text>
      <text x="22" y="108">features du modèle (réentraînement requis).</text>

      <circle cx="6" cy="136" r="3" fill="#A32D2D"/>
      <text x="22" y="140" font-weight="500" fill="#111827">Kafka sans persistance</text>
      <text x="22" y="160">Données et offsets perdus à chaque</text>
      <text x="22" y="178">redémarrage du broker.</text>

      <circle cx="6" cy="206" r="3" fill="#A32D2D"/>
      <text x="22" y="210" font-weight="500" fill="#111827">Authentification basique</text>
      <text x="22" y="230">Un seul compte utilisateur, pas de RBAC</text>
      <text x="22" y="248">ni de multi-utilisateurs.</text>

      <circle cx="6" cy="276" r="3" fill="#A32D2D"/>
      <text x="22" y="280" font-weight="500" fill="#111827">Pas de HTTPS natif</text>
      <text x="22" y="300">LoadBalancer exposé en HTTP, sans</text>
      <text x="22" y="318">chiffrement TLS de bout en bout.</text>

      <circle cx="6" cy="346" r="3" fill="#A32D2D"/>
      <text x="22" y="350" font-weight="500" fill="#111827">Quota SendGrid limité</text>
      <text x="22" y="370">Trial gratuit : 100 emails/jour pendant</text>
      <text x="22" y="388">60 jours seulement.</text>
    </g>
  </g>

  <g transform="translate(610,160)">
    <rect width="540" height="510" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="0" y="0" width="540" height="56" rx="14" fill="#E1F5EE"/>
    <rect x="0" y="42" width="540" height="14" fill="#E1F5EE"/>
    <circle cx="30" cy="28" r="14" fill="#0F6E56"/>
    <text x="30" y="33" text-anchor="middle" font-size="16" font-weight="500" fill="#ffffff">+</text>
    <text x="60" y="34" font-size="20" font-weight="500" fill="#04342C">Améliorations possibles</text>

    <g transform="translate(30,95)" fill="#374151" font-size="14">
      <circle cx="6" cy="-4" r="3" fill="#0F6E56"/>
      <text x="22" y="0" font-weight="500" fill="#111827">Seuils adaptatifs par source</text>
      <text x="22" y="20">Calculer un seuil dynamique par couple</text>
      <text x="22" y="38">(source, host) ou via une fenêtre glissante.</text>

      <circle cx="6" cy="66" r="3" fill="#0F6E56"/>
      <text x="22" y="70" font-weight="500" fill="#111827">Réentraînement automatisé</text>
      <text x="22" y="90">Pipeline Vertex AI déclenché par drift</text>
      <text x="22" y="108">détection ou via cron mensuel.</text>

      <circle cx="6" cy="136" r="3" fill="#0F6E56"/>
      <text x="22" y="140" font-weight="500" fill="#111827">Kafka en StatefulSet + PVC</text>
      <text x="22" y="160">Persistance des messages et offsets</text>
      <text x="22" y="178">pour garantir la durabilité.</text>

      <circle cx="6" cy="206" r="3" fill="#0F6E56"/>
      <text x="22" y="210" font-weight="500" fill="#111827">IAP + multi-utilisateurs</text>
      <text x="22" y="230">Identity-Aware Proxy GCP + intégration</text>
      <text x="22" y="248">SSO et gestion des rôles (RBAC).</text>

      <circle cx="6" cy="276" r="3" fill="#0F6E56"/>
      <text x="22" y="280" font-weight="500" fill="#111827">Observabilité avancée</text>
      <text x="22" y="300">Métriques applicatives Prometheus +</text>
      <text x="22" y="318">tracing distribué (OpenTelemetry).</text>

      <circle cx="6" cy="346" r="3" fill="#0F6E56"/>
      <text x="22" y="350" font-weight="500" fill="#111827">Intégrations alerting</text>
      <text x="22" y="370">Slack, PagerDuty, Microsoft Teams en</text>
      <text x="22" y="388">complément des emails.</text>

      <circle cx="6" cy="416" r="3" fill="#0F6E56"/>
      <text x="22" y="420" font-weight="500" fill="#111827">Modèle multi-tâches</text>
      <text x="22" y="440">Ajout classification (type d'incident) et</text>
      <text x="22" y="458">prédiction de criticité aux côtés du score.</text>
    </g>
  </g>

  <text x="600" y="700" text-anchor="middle" font-size="12" fill="#9ca3af">LogGuardian — AIOps Command Center</text>
</svg>
